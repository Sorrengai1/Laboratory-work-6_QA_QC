<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Локальна сторінка для тестів</title>
</head>
<body>
    <h1 style="font-size: 48px;">Вітаємо на локальній сторінці!</h1>
    <form id="loginForm">
        <input type="text" id="username" placeholder="Ім'я користувача" required>
        <input type="password" id="password" placeholder="Пароль" required>
        <button type="submit" id="loginButton">Увійти</button>
    </form>
    <p id="successMessage" style="display: none;">Успішний вхід!</p>
    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            document.getElementById('successMessage').style.display = 'block';
        });
    </script>
</body>
</html>
